# Task: T4-010 - Frontend Deployment
# From: specs/phase4-kubernetes/spec.md §4.4

apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: todo-app
  labels:
    app: todo
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
      component: frontend
  template:
    metadata:
      labels:
        app: todo
        component: frontend
    spec:
      containers:
        - name: frontend
          image: todo-frontend:latest
          imagePullPolicy: Never  # Use local image
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            # From Secrets
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: BETTER_AUTH_SECRET
            # From ConfigMap
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: BETTER_AUTH_URL
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-config
                  key: NEXT_PUBLIC_BETTER_AUTH_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
