# Task: T-001 - Project configuration
# From: specs/phase1-console/tasks.md

[project]
name = "todo-app"
version = "1.0.0"
description = "Evolution of Todo - Phase I: In-Memory Python Console App"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Hackathon II Participant" }
]

[project.scripts]
todo = "src.todo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo"]
